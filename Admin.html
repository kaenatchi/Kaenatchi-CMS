<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدیریت کائنات‌چی</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f1e5;
      color: #294536;
      font-family: Tahoma, Arial, sans-serif;
      direction: rtl;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 18px 14px 50px;
    }

    /* HEADER */

    .header {
      background: #fffdf8;
      border: 1px solid #e4dac8;
      border-radius: 26px;
      padding: 24px 18px;
      text-align: center;
      margin-bottom: 18px;
      box-shadow: 0 7px 25px rgba(45, 65, 50, 0.05);
    }

    .logo {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #294536;
      color: #f7f1e5;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 30px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 8px 0 0;
      color: #788078;
      font-size: 13px;
    }

    /* DASHBOARD */

    .dashboard-title {
      font-size: 18px;
      font-weight: bold;
      margin: 20px 2px 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: #fffdf8;
      border: 1px solid #e4dac8;
      border-radius: 18px;
      padding: 15px 10px;
      text-align: center;
    }

    .stat-number {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-title {
      color: #788078;
      font-size: 12px;
    }

    /* MENU */

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .menu-button {
      border: 1px solid #ded5c4;
      background: #fffdf8;
      color: #294536;
      border-radius: 20px;
      padding: 20px 16px;
      text-align: right;
      transition: .2s;
    }

    .menu-button:active {
      transform: scale(.98);
    }

    .menu-icon {
      display: block;
      font-size: 26px;
      margin-bottom: 9px;
    }

    .menu-title {
      display: block;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .menu-description {
      display: block;
      color: #7b827b;
      font-size: 11px;
      line-height: 1.7;
    }

    /* CONTENT */

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .section-top {
      background: #fffdf8;
      border: 1px solid #e4dac8;
      border-radius: 22px;
      padding: 17px;
      margin-bottom: 14px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .section-title {
      margin: 0;
      font-size: 20px;
    }

    .back {
      border: none;
      background: transparent;
      color: #68766b;
      padding: 0;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .add-button {
      border: none;
      background: #294536;
      color: white;
      border-radius: 13px;
      padding: 11px 15px;
      font-size: 13px;
      white-space: nowrap;
    }

    /* SEARCH */

    .search-box {
      margin-top: 14px;
    }

    .search-box input {
      width: 100%;
      border: 1px solid #ded5c4;
      background: white;
      border-radius: 13px;
      padding: 12px;
      color: #294536;
      outline: none;
      font-size: 13px;
    }

    /* ITEMS */

    .items {
      display: grid;
      gap: 12px;
    }

    .item {
      background: #fffdf8;
      border: 1px solid #e4dac8;
      border-radius: 20px;
      padding: 17px;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .item-title {
      font-weight: bold;
      font-size: 16px;
      line-height: 1.7;
    }

    .status {
      border-radius: 20px;
      padding: 5px 9px;
      font-size: 10px;
      white-space: nowrap;
    }

    .status.active {
      background: #e4efe6;
      color: #31583e;
    }

    .status.inactive {
      background: #eeeae1;
      color: #77736b;
    }

    .item-info {
      margin-top: 9px;
      color: #737c73;
      font-size: 12px;
      line-height: 1.9;
    }

    .info-row {
      margin-bottom: 3px;
    }

    .info-label {
      color: #536356;
      font-weight: bold;
    }

    .item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .action {
      border: 1px solid #dcd3c2;
      background: #f9f5ed;
      color: #294536;
      border-radius: 11px;
      padding: 8px 11px;
      font-size: 11px;
    }

    .action.danger {
      color: #8a4444;
    }

    .empty {
      background: #fffdf8;
      border: 1px dashed #d8cfbf;
      border-radius: 20px;
      padding: 35px 20px;
      text-align: center;
      color: #7c837c;
      line-height: 2;
      font-size: 13px;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(30, 40, 32, .48);
      padding: 14px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      width: 100%;
      max-width: 680px;
      max-height: 94vh;
      overflow-y: auto;
      background: #fffdf8;
      border-radius: 25px;
      padding: 20px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 19px;
    }

    .close {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: #f0ebe1;
      color: #536356;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
      color: #435747;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #dcd3c2;
      border-radius: 12px;
      background: white;
      color: #294536;
      padding: 11px;
      outline: none;
      font-size: 13px;
    }

    .form-group textarea {
      min-height: 105px;
      resize: vertical;
      line-height: 1.8;
    }

    .form-help {
      color: #858b85;
      font-size: 10px;
      margin-top: 5px;
      line-height: 1.6;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 20px;
    }

    .save {
      border: none;
      border-radius: 13px;
      background: #294536;
      color: white;
      padding: 13px;
    }

    .cancel {
      border: 1px solid #dcd3c2;
      border-radius: 13px;
      background: #f8f4eb;
      color: #294536;
      padding: 13px;
    }

    /* TOAST */

    .toast {
      position: fixed;
      z-index: 3000;
      left: 15px;
      right: 15px;
      bottom: 18px;
      max-width: 500px;
      margin: auto;
      background: #294536;
      color: white;
      border-radius: 14px;
      padding: 13px 16px;
      text-align: center;
      font-size: 12px;
      display: none;
    }

    .toast.show {
      display: block;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: #788078;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .menu {
        grid-template-columns: 1fr;
      }

      .section-head {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">
    <div class="logo">🌿</div>

    <h1>مدیریت کائنات‌چی</h1>

    <p>
      مدیریت محتوا و اطلاعات Mini App
    </p>
  </div>


  <!-- DASHBOARD -->

  <div id="dashboard" class="section active">

    <div class="dashboard-title">
      🌿 داشبورد
    </div>

    <div id="stats" class="stats">

      <div class="stat">
        <div class="stat-number">—</div>
        <div class="stat-title">خدمات</div>
      </div>

      <div class="stat">
        <div class="stat-number">—</div>
        <div class="stat-title">کلاس‌ها</div>
      </div>

      <div class="stat">
        <div class="stat-number">—</div>
        <div class="stat-title">ایونت‌ها</div>
      </div>

      <div class="stat">
        <div class="stat-number">—</div>
        <div class="stat-title">سؤالات متداول</div>
      </div>

      <div class="stat">
        <div class="stat-number">—</div>
        <div class="stat-title">صفحات</div>
      </div>

      <div class="stat">
        <div class="stat-number">—</div>
        <div class="stat-title">تنظیمات</div>
      </div>

    </div>


    <div class="menu">

      <button class="menu-button"
              onclick="openSection('services')">

        <span class="menu-icon">📋</span>

        <span class="menu-title">
          خدمات
        </span>

        <span class="menu-description">
          مدیریت خدمات کائنات‌چی، توضیحات، قیمت و تصویر
        </span>

      </button>


      <button class="menu-button"
              onclick="openSection('courses')">

        <span class="menu-icon">🎓</span>

        <span class="menu-title">
          کلاس‌ها
        </span>

        <span class="menu-description">
          مدیریت دوره‌ها و کلاس‌های آموزشی
        </span>

      </button>


      <button class="menu-button"
              onclick="openSection('events')">

        <span class="menu-icon">🎟️</span>

        <span class="menu-title">
          ایونت‌ها
        </span>

        <span class="menu-description">
          مدیریت رویدادها و برنامه‌ها
        </span>

      </button>


      <button class="menu-button"
              onclick="openSection('faq')">

        <span class="menu-icon">❓</span>

        <span class="menu-title">
          سؤالات متداول
        </span>

        <span class="menu-description">
          مدیریت سؤال و جواب‌های کاربران
        </span>

      </button>


      <button class="menu-button"
              onclick="openSection('pages')">

        <span class="menu-icon">📄</span>

        <span class="menu-title">
          صفحات
        </span>

        <span class="menu-description">
          مدیریت متن و محتوای صفحات
        </span>

      </button>


      <button class="menu-button"
              onclick="openSection('settings')">

        <span class="menu-icon">⚙️</span>

        <span class="menu-title">
          تنظیمات
        </span>

        <span class="menu-description">
          مدیریت تنظیمات کلی Mini App
        </span>

      </button>

    </div>

  </div>


  <!-- CONTENT SECTIONS -->

  <div id="contentSections"></div>

</div>


<!-- MODAL -->

<div id="modal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h3 id="modalTitle">
        افزودن
      </h3>

      <button class="close"
              onclick="closeModal()">
        ×
      </button>

    </div>

    <div id="form"></div>

    <div class="modal-actions">

      <button class="save"
              onclick="saveItem()">
        💾 ذخیره
      </button>

      <button class="cancel"
              onclick="closeModal()">
        انصراف
      </button>

    </div>

  </div>

</div>


<!-- TOAST -->

<div id="toast" class="toast"></div>


<script>

  let cmsData = null;

  let currentSection = null;

  let editingRow = null;


  const sectionNames = {

    services: {
      sheet: 'services',
      title: 'خدمات',
      icon: '📋'
    },

    courses: {
      sheet: 'courses',
      title: 'کلاس‌ها',
      icon: '🎓'
    },

    events: {
      sheet: 'events',
      title: 'ایونت‌ها',
      icon: '🎟️'
    },

    faq: {
      sheet: 'faq',
      title: 'سؤالات متداول',
      icon: '❓'
    },

    pages: {
      sheet: 'pages',
      title: 'صفحات',
      icon: '📄'
    },

    settings: {
      sheet: 'settings',
      title: 'تنظیمات',
      icon: '⚙️'
    }

  };


  document.addEventListener(
    'DOMContentLoaded',
    loadCMS
  );


  function loadCMS() {

    showToast('در حال اتصال به CMS...');

    google.script.run

      .withSuccessHandler(function(data) {

        cmsData = data;

        renderStats();

        hideToast();

      })

      .withFailureHandler(function(error) {

        showToast(
          'خطا در اتصال به CMS: ' +
          error.message
        );

      })

      .getCMSData();

  }


  function renderStats() {

    if (!cmsData) return;

    const values = [

      cmsData.services.rows.length,

      cmsData.courses.rows.length,

      cmsData.events.rows.length,

      cmsData.faq.rows.length,

      cmsData.pages.rows.length,

      cmsData.settings.rows.length

    ];

    const numbers =
      document.querySelectorAll(
        '.stat-number'
      );

    values.forEach(function(value, index) {

      if (numbers[index]) {
        numbers[index].textContent = value;
      }

    });

  }


  function openSection(section) {

    currentSection = section;

    document
      .querySelectorAll('.section')
      .forEach(function(el) {
        el.classList.remove('active');
      });

    document
      .getElementById('dashboard')
      .classList.remove('active');

    let container =
      document.getElementById(
        'section-' + section
      );

    if (!container) {

      container =
        document.createElement('div');

      container.id =
        'section-' + section;

      container.className =
        'section';

      document
        .getElementById('contentSections')
        .appendChild(container);

    }

    container.classList.add('active');

    renderSection(section);

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });

  }


  function renderSection(section) {

    const config =
      sectionNames[section];

    const data =
      cmsData[config.sheet];

    const container =
      document.getElementById(
        'section-' + section
      );

    container.innerHTML = '';


    const top =
      document.createElement('div');

    top.className =
      'section-top';


    top.innerHTML = `

      <button class="back"
              onclick="backToDashboard()">
        ← بازگشت به داشبورد
      </button>

      <div class="section-head">

        <h2 class="section-title">
          ${config.icon}
          ${config.title}
        </h2>

        <button class="add-button"
                onclick="openAddModal('${section}')">
          ＋ افزودن
        </button>

      </div>

      <div class="search-box">

        <input
          type="search"
          placeholder="🔎 جستجو..."
          oninput="filterItems('${section}', this.value)"
        >

      </div>

    `;

    container.appendChild(top);


    const items =
      document.createElement('div');

    items.className = 'items';

    items.id =
      'items-' + section;


    if (!data.rows.length) {

      items.innerHTML = `

        <div class="empty">

          هنوز موردی در این بخش وجود ندارد.

          <br>

          برای شروع روی «＋ افزودن» بزن.

        </div>

      `;

    } else {

      renderItems(
        section,
        data.rows,
        items
      );

    }


    container.appendChild(items);

  }


  function renderItems(
    section,
    rows,
    container
  ) {

    container.innerHTML = '';


    if (!rows.length) {

      container.innerHTML = `

        <div class="empty">
          موردی پیدا نشد.
        </div>

      `;

      return;

    }


    rows.forEach(function(row) {

      const card =
        document.createElement('div');

      card.className = 'item';

      card.dataset.search =
        JSON.stringify(row)
          .toLowerCase();


      const active =
        isActive(row['فعال']);


      card.innerHTML = `

        <div class="item-top">

          <div class="item-title">
            ${escapeHtml(
              getTitle(row, section)
            )}
          </div>

          <div class="status ${
            active
              ? 'active'
              : 'inactive'
          }">

            ${
              active
                ? 'فعال'
                : 'غیرفعال'
            }

          </div>

        </div>


        <div class="item-info">

          ${buildInfo(row, section)}

        </div>


        <div class="item-actions">

          <button
            class="action"
            onclick="openEditModal(
              '${section}',
              ${row._row}
            )">

            ✏️ ویرایش

          </button>


          <button
            class="action"
            onclick="toggleActive(
              '${section}',
              ${row._row}
            )">

            ${
              active
                ? '⏸ غیرفعال کردن'
                : '▶️ فعال کردن'
            }

          </button>


          <button
            class="action danger"
            onclick="deleteItem(
              '${section}',
              ${row._row}
            )">

            🗑 حذف

          </button>

        </div>

      `;


      container.appendChild(card);

    });

  }


  function filterItems(
    section,
    search
  ) {

    const container =
      document.getElementById(
        'items-' + section
      );

    if (!container) return;


    const cards =
      container.querySelectorAll(
        '.item'
      );


    const term =
      String(search || '')
        .trim()
        .toLowerCase();


    let visible = 0;


    cards.forEach(function(card) {

      const match =
        !term ||
        card.dataset.search.includes(term);


      card.style.display =
        match ? '' : 'none';


      if (match) {
        visible++;
      }

    });


    const oldEmpty =
      container.querySelector(
        '.search-empty'
      );


    if (oldEmpty) {
      oldEmpty.remove();
    }


    if (
      term &&
      visible === 0
    ) {

      const empty =
        document.createElement('div');

      empty.className =
        'empty search-empty';

      empty.textContent =
        'موردی با این عبارت پیدا نشد.';

      container.appendChild(empty);

    }

  }


  function getTitle(
    row,
    section
  ) {

    if (section === 'services')
      return row['نام خدمت'] ||
        'خدمت بدون نام';


    if (section === 'courses')
      return row['نام دوره'] ||
        'دوره بدون نام';


    if (section === 'events')
      return row['نام ایونت'] ||
        'ایونت بدون نام';


    if (section === 'faq')
      return row['سؤال'] ||
        'سؤال بدون عنوان';


    if (section === 'pages')
      return row['نام صفحه'] ||
        'صفحه بدون نام';


    if (section === 'settings')
      return row['کلید'] ||
        'تنظیمات';


    return 'بدون عنوان';

  }


  function buildInfo(
    row,
    section
  ) {

    const ignored = [

      '_row',

      'فعال',

      'نام خدمت',

      'نام دوره',

      'نام ایونت',

      'سؤال',

      'نام صفحه',

      'کلید'

    ];


    let html = '';


    Object.keys(row)
      .forEach(function(key) {

        if (
          ignored.includes(key) ||
          !row[key]
        ) {
          return;
        }


        let value =
          String(row[key]);


        if (value.length > 220) {
          value =
            value.substring(0, 220) +
            '…';
        }


        html += `

          <div class="info-row">

            <span class="info-label">
              ${escapeHtml(key)}:
            </span>

            ${escapeHtml(value)}

          </div>

        `;

      });


    return html;

  }


  function openAddModal(section) {

    currentSection = section;

    editingRow = null;


    const config =
      sectionNames[section];


    const headers =
      cmsData[config.sheet].headers;


    document.getElementById(
      'modalTitle'
    ).textContent =
      config.icon +
      ' افزودن ' +
      config.title;


    renderForm(
      headers,
      {}
    );


    document
      .getElementById('modal')
      .classList.add('show');

  }


  function openEditModal(
    section,
    rowNumber
  ) {

    currentSection = section;

    editingRow = rowNumber;


    const config =
      sectionNames[section];


    const data =
      cmsData[config.sheet];


    const row =
      data.rows.find(
        function(item) {
          return item._row === rowNumber;
        }
      );


    if (!row) {

      showToast(
        'مورد موردنظر پیدا نشد.'
      );

      return;

    }


    document.getElementById(
      'modalTitle'
    ).textContent =
      config.icon +
      ' ویرایش ' +
      config.title;


    renderForm(
      data.headers,
      row
    );


    document
      .getElementById('modal')
      .classList.add('show');

  }


  function renderForm(
    headers,
    values
  ) {

    const form =
      document.getElementById('form');


    form.innerHTML = '';


    headers.forEach(function(header) {

      const group =
        document.createElement('div');

      group.className =
        'form-group';


      const label =
        document.createElement('label');

      label.textContent =
        header;


      group.appendChild(label);


      let field;


      if (header === 'فعال') {

        field =
          document.createElement('select');


        field.innerHTML = `

          <option value="بله">
            بله — نمایش داده شود
          </option>

          <option value="خیر">
            خیر — مخفی باشد
          </option>

        `;


        field.value =
          values[header] ||
          'بله';

      }


      else if (
        header === 'توضیحات کامل' ||
        header === 'پاسخ' ||
        header === 'متن' ||
        header === 'سرفصل‌ها'
      ) {

        field =
          document.createElement(
            'textarea'
          );


        field.value =
          values[header] || '';

      }


      else {

        field =
          document.createElement(
            'input'
          );


        field.type = 'text';


        field.value =
          values[header] || '';

      }


      field.dataset.header =
        header;


      group.appendChild(field);


      const help =
        getFieldHelp(
          header
        );


      if (help) {

        const helpElement =
          document.createElement(
            'div'
          );

        helpElement.className =
          'form-help';

        helpElement.textContent =
          help;

        group.appendChild(
          helpElement
        );

      }


      form.appendChild(group);

    });

  }


  function getFieldHelp(header) {

    const help = {

      'فعال':
        'فقط موارد فعال در Mini App نمایش داده خواهند شد.',

      'قیمت':
        'مبلغ را بدون جداکننده وارد کن؛ مثلاً 800000.',

      'هزینه':
        'مبلغ را بدون جداکننده وارد کن.',

      'تصویر':
        'لینک مستقیم تصویر را وارد کن.',

      'ترتیب':
        'عدد کمتر یعنی نمایش زودتر.',

      'ظرفیت':
        'ظرفیت قابل ثبت برای ایونت.',

      'تاریخ':
        'تاریخ برگزاری ایونت را وارد کن.',

      'ساعت':
        'ساعت برگزاری ایونت را وارد کن.'

    };


    return help[header] || '';

  }


  function saveItem() {

    if (!currentSection) {
      return;
    }


    const config =
      sectionNames[
        currentSection
      ];


    const inputs =
      document.querySelectorAll(
        '#form [data-header]'
      );


    const data = {};


    inputs.forEach(function(input) {

      data[input.dataset.header] =
        input.value;

    });


    showToast(
      'در حال ذخیره...'
    );


    if (editingRow === null) {

      google.script.run

        .withSuccessHandler(
          function() {

            closeModal();

            showToast(
              'با موفقیت اضافه شد 🌿'
            );

            reloadAndRender();

          }
        )

        .withFailureHandler(
          function(error) {

            showToast(
              'خطا: ' +
              error.message
            );

          }
        )

        .addItem(
          config.sheet,
          data
        );

    }


    else {

      google.script.run

        .withSuccessHandler(
          function() {

            closeModal();

            showToast(
              'با موفقیت ویرایش شد 🌿'
            );

            reloadAndRender();

          }
        )

        .withFailureHandler(
          function(error) {

            showToast(
              'خطا: ' +
              error.message
            );

          }
        )

        .updateItem(
          config.sheet,
          editingRow,
          data
        );

    }

  }


  function toggleActive(
    section,
    rowNumber
  ) {

    if (
      !confirm(
        'وضعیت این مورد تغییر کند؟'
      )
    ) {
      return;
    }


    const config =
      sectionNames[section];


    showToast(
      'در حال تغییر وضعیت...'
    );


    google.script.run

      .withSuccessHandler(
        function() {

          showToast(
            'وضعیت تغییر کرد 🌿'
          );

          reloadAndRender();

        }
      )

      .withFailureHandler(
        function(error) {

          showToast(
            'خطا: ' +
            error.message
          );

        }
      )

      .toggleItem(
        config.sheet,
        rowNumber
      );

  }


  function deleteItem(
    section,
    rowNumber
  ) {

    if (
      !confirm(
        'این مورد حذف شود؟\n\nاین عملیات قابل بازگشت نیست.'
      )
    ) {
      return;
    }


    const config =
      sectionNames[section];


    showToast(
      'در حال حذف...'
    );


    google.script.run

      .withSuccessHandler(
        function() {

          showToast(
            'مورد حذف شد.'
          );

          reloadAndRender();

        }
      )

      .withFailureHandler(
        function(error) {

          showToast(
            'خطا: ' +
            error.message
          );

        }
      )

      .deleteItem(
        config.sheet,
        rowNumber
      );

  }


  function reloadAndRender() {

    google.script.run

      .withSuccessHandler(
        function(data) {

          cmsData = data;

          renderStats();


          if (currentSection) {

            renderSection(
              currentSection
            );

          }

        }
      )

      .withFailureHandler(
        function(error) {

          showToast(
            'خطا در بارگذاری: ' +
            error.message
          );

        }
      )

      .getCMSData();

  }


  function closeModal() {

    document
      .getElementById('modal')
      .classList.remove('show');


    document.getElementById(
      'form'
    ).innerHTML = '';


    editingRow = null;

  }


  function backToDashboard() {

    document
      .querySelectorAll('.section')
      .forEach(function(el) {
        el.classList.remove('active');
      });


    document
      .getElementById('dashboard')
      .classList.add('active');


    currentSection = null;


    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });

  }


  function isActive(value) {

    const v =
      String(value || '')
        .trim()
        .toLowerCase();


    return (

      v === 'بله' ||

      v === 'فعال' ||

      v === 'true' ||

      v === '1' ||

      v === 'yes'

    );

  }


  function escapeHtml(value) {

    return String(value)

      .replace(
        /&/g,
        '&amp;'
      )

      .replace(
        /</g,
        '&lt;'
      )

      .replace(
        />/g,
        '&gt;'
      )

      .replace(
        /"/g,
        '&quot;'
      )

      .replace(
        /'/g,
        '&#039;'
      );

  }


  function showToast(message) {

    const toast =
      document.getElementById(
        'toast'
      );


    toast.textContent =
      message;


    toast.classList.add(
      'show'
    );


    if (
      !String(message)
        .startsWith('در حال')
    ) {

      setTimeout(
        function() {

          toast.classList.remove(
            'show'
          );

        },
        2500
      );

    }

  }


  function hideToast() {

    document
      .getElementById('toast')
      .classList.remove(
        'show'
      );

  }


  document
    .getElementById('modal')
    .addEventListener(
      'click',
      function(event) {

        if (
          event.target === this
        ) {

          closeModal();

        }

      }
    );

</script>

</body>
</html>
